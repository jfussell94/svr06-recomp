<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SvR06 Launcher</title>
<link rel="stylesheet" href="/ui/style.css">
<link rel="icon" type="image/png" href="/ui/icon.png">
<script>window.TOKEN = "__TOKEN__";</script>
</head>
<body>
<div class="titlebar pywebview-drag-region" id="titlebar" hidden>
  <div class="tb-brand pywebview-drag-region"><img src="/ui/icon.png" alt="" aria-hidden="true"><span class="pywebview-drag-region">SvR06 <b class="pywebview-drag-region">Recomp</b></span></div>
  <button class="tb-search" id="tbsearch" title="Search (Ctrl+K)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search settings, cheats, pages&hellip;</span><kbd>Ctrl K</kbd></button>
  <div class="tb-fill pywebview-drag-region"></div>
  <button class="tb-btn" id="tbmin" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M1 6h10"/></svg></button>
  <button class="tb-btn" id="tbmax" aria-label="Maximize"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9"/></svg></button>
  <button class="tb-btn close" id="tbclose" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11"/></svg></button>
</div>
<div class="palette" id="palette" hidden><div class="pal-box"><input id="palq" placeholder="Type to search pages, settings and cheats" autocomplete="off"><div id="palres"></div></div></div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="/ui/icon.png" class="logo" alt="" aria-hidden="true">
      <div><div class="brand-t">SvR <span>2006</span></div><div class="brand-s">Native recomp launcher</div></div>
    </div>
    <nav id="nav"></nav>
    <div id="navfoot"></div>
    <div class="side-foot">
      <div class="verchip" id="ver">v-</div>
      <div class="rootpath" id="rootpath"></div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <h1 id="pagetitle">Play</h1>
      <div class="top-r">
        <div class="pill" id="statuspill"><span class="dot"></span><span id="statustext">checking...</span></div>
        <button class="btn ghost sm" id="topquit" title="Close the running game">Quit game</button>
      </div>
    </header>
    <div class="buildbar" id="buildbar" hidden><div class="bb-fill" id="bbfill"></div><span id="bbtext"></span></div>
    <div class="content" id="content"></div>
  </main>
</div>
<!-- borderless window: resize handles on every edge and corner (native window only) -->
<div class="rz" id="rz" hidden><i data-rz="n"></i><i data-rz="s"></i><i data-rz="e"></i><i data-rz="w"></i><i data-rz="ne"></i><i data-rz="nw"></i><i data-rz="se"></i><i data-rz="sw"></i></div>
<div class="toasts" id="toasts"></div>
<div class="lightbox" id="lightbox" hidden><img id="lbimg" alt=""><div class="lb-cap" id="lbcap"></div></div>
<script src="/ui/app.js"></script>
</body>
</html>
