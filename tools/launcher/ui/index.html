<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SvR06 Launcher</title>
<link rel="stylesheet" href="/ui/style.css">
<script>window.TOKEN = "__TOKEN__";</script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 48 48" class="logo" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs><rect x="3" y="3" width="42" height="42" rx="12" fill="url(#lg)"/><path d="M15 31.5c2.2 1.6 4.4 2.4 6.6 2.4 3.1 0 4.7-1.3 4.7-3.2 0-5.2-11.8-2.8-11.8-10.6 0-3.6 3-6.3 8-6.3 2.5 0 4.7.6 6.6 1.8l-2 3.8c-1.5-.9-3.1-1.4-4.8-1.4-2.3 0-3.4 1-3.4 2.3 0 4.8 11.8 2.4 11.8 10.4 0 3.9-3.1 6.7-8.4 6.7-3.1 0-5.9-.9-8.1-2.6z" fill="#fff" opacity=".96"/></svg>
      <div><div class="brand-t">SvR 2006</div><div class="brand-s">Native recomp launcher</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="verchip" id="ver">v-</div>
      <div class="rootpath" id="rootpath"></div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <h1 id="pagetitle">Play</h1>
      <div class="top-r">
        <div class="pill" id="statuspill"><span class="dot"></span><span id="statustext">checking...</span></div>
        <button class="btn ghost sm" id="topquit" title="Close the running game">Quit game</button>
      </div>
    </header>
    <div class="buildbar" id="buildbar" hidden><div class="bb-fill" id="bbfill"></div><span id="bbtext"></span></div>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<div class="lightbox" id="lightbox" hidden><img id="lbimg" alt=""><div class="lb-cap" id="lbcap"></div></div>
<script src="/ui/app.js"></script>
</body>
</html>
