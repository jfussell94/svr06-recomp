name: ci
on: [push, pull_request]
jobs:
  clean-and-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: No game content
        run: python tools/check_clean.py
      - name: Launcher builds
        run: powershell -File tools/launcher/build_launcher.ps1
      - uses: actions/upload-artifact@v4
        with: { name: SvR06Launcher, path: dist/SvR06Launcher.exe }
